[General]
; 0 = off, 1 = on.
Enabled=1
; 122 = F11. 0 = no key.
ToggleKey=122

[LevelOfDetail]
; How far objects keep their detailed models.
; 1.0 to 2.5. The game uses 1.0.
DetailDistance=2.00
; Rocks, props, bushes and some trees on top of the detail distance.
; 1.0 to 3.0. The game uses 1.0.
ObjectsDistance=2.33
; Leaves and branches of trees and large plants on top of the detail distance.
; 1.0 to 3.0. The game uses 1.0.
FoliageDistance=2.33
; How far out grass and small plants appear and how detailed they stay.
; 1.0 to 4.0. The game uses 1.0.
ClutterDetail=3.00
; How far out the game loads detailed models and far tree lines. No effect while clutter is at 1.0.
; 1.0 to 2.0. The game uses 1.0.
StreamingDistance=2.00
; How long a model takes to blend into its next level of detail.
; 0.15 to 0.50 seconds. The game uses 0.50.
ModelFade=0.30

[AmbientOcclusion]
; 25 to 200 percent. The game uses 100.
Strength=100
; 0.5 to 16 meters. The game uses 2.
Radius=2
; 0 = horizon-based, 1 = visibility bitmask. The game uses 0.
Method=1
; Visibility bitmask only. 0.02 to 1 meters.
BitmaskThickness=0.40
; Raises the game's ambient light in shade. 0.5 to 3. The game uses 1.
BounceLight=1.30
; Sky light in shade by day. 0.5 to 2. The game uses 1.
SkyLightDay=1.13
; Sky light in shade at night. 0.5 to 2. The game uses 1.
SkyLightNight=0.8
; Lets AO dim sunlight where it is strong. 0 to 1. The game uses 0.
SunlightOcclusion=0.32
; Combines AO with the material's own baked shade. 0 to 1. The game uses 0.
BakedShadeBlend=0.75
; 2 to 12. The game uses 2.
Directions=4
; 5 to 32. The game uses 5.
Steps=20
; More steps close to each pixel. 1 to 3. The game uses 1.
SampleSpread=1.4
; 128 to 512 pixels at half resolution. The game uses 128.
MaxRadius=299
; No shade beyond this distance. 32 to 1024 meters. The game uses 256.
MaxDistance=768
; The share of the radius where occluders begin to count less. 0.25 to 2. The game uses 0.5.
FalloffStart=0.83
; Occluders far behind a surface count less. 0 to 8. The game uses 0.
FarOccluderFade=1.5
; Pixels skipped next to each pixel. 0 to 4. The game uses 0.
MinOffset=1.3
; Limits how dark shade can get. 0 to 0.2. The game uses 0.
MinVisibility=0.03
; How much the AO is smoothed. Below 1 keeps finer shade. 0 to 4. The game uses 1.
BlurWidth=0.50
; Stops the blur where the surface turns. 0.5 to 32. The game uses 4.
BlurNormal=8.0

[ScreenSpaceReflectionsWater]
; 0.50 to 1. The game uses 0.70.
Smoothing=0.80
; 0.70 to 1. The game uses 0.70.
EdgeTop=0.87
; How steeply the camera can look down before reflections fade out. 35 to 80 degrees. The game uses 35.
ReflectionAngle=52
; 128 to 4096. The game uses 128.
Steps=1024
; Extra depth checks for the exact hit point. 0 to 4. The game uses 0.
Refinement=3
; 1 to 8. The game uses 2.0.
Thickness=1.3
; 0.002 to 0.1. The game uses 0.018.
FarThickness=0.009
; 0 to 4. The game uses 1.50.
Jitter=1.00
; How finely the ray start noise spreads. 64 to 128. The game uses 64.
NoiseTexels=128
; 0 = half, 1 = three quarters, 2 = full. The game uses 0.
Resolution=1
; Keeps reflections from trailing in camera motion. 0 or 1. The game uses 0.
SharpInMotion=1
; Reads the lower-resolution reflection with a smooth filter. 0 to 1. The game uses 0.
SmoothUpscale=0.67
; Blends each reflection pixel with its neighbors. 0 to 1. The game uses 0.
Softening=0.33

[ScreenSpaceReflectionsSurfaces]
; How much the screen-space reflection replaces the game's. 0 to 1. The game uses 0.
Strength=0.80
; Rougher surfaces keep the game's reflection. 0.30 to 0.80.
MaxRoughness=0.70
; 32 to 128.
RaySteps=64
; 0.5 = half, 0.75 = three quarters, 1 = full.
Resolution=0.75

[IndirectLighting]
; Light that nearby surfaces bounce onto each other. 0.1 to 10. 0 turns it off. The game uses 0.
Strength=2.30
; How far a surface may be to light a spot. 0.25 to 8 meters.
Radius=3.00
; Directions each pixel searches. 1 to 8.
Directions=2
; Samples along each direction. 2 to 32.
Steps=20

[Diagnostics]
; Detailed logging.
Debug=0
