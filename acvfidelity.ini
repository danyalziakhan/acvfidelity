[LevelOfDetail]
; How far objects keep their detailed models.
; 1.0 to 2.5. The game uses 1.0.
DetailDistance=2.00
; Rocks, props, bushes and some trees on top of the detail distance.
; 1.0 to 3.0. The game uses 1.0.
ObjectsDistance=2.33
; Leaves and branches of trees and large plants on top of the detail distance.
; 1.0 to 3.0. The game uses 1.0.
FoliageDistance=2.33
; How far out grass and small plants appear and how detailed they stay.
; 1.0 to 4.0. The game uses 1.0.
ClutterDetail=3.00
; How long a model takes to blend into its next level of detail.
; 0.15 to 0.50 seconds. The game uses 0.50.
ModelFade=0.30

